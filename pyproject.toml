[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "megamind-axi"
version = "0.3.0"
description = "Agent-native AXI for the Megamind knowledge gardener: deterministic progressive retrieval, proposal-first capture, and safe evolution of Markdown/Obsidian wikis, with TOON/JSON typed output."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Megamind contributors" }]
keywords = [
  "axi",
  "agents",
  "knowledge-management",
  "markdown",
  "obsidian",
  "wiki",
  "retrieval",
  "local-first",
  "toon",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/yelenplays/megamind"
Repository = "https://github.com/yelenplays/megamind"
Issues = "https://github.com/yelenplays/megamind/issues"

[project.scripts]
megamind-axi = "megamind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/megamind"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "skills", "LICENSE", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/megamind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
